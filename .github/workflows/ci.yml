name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test
      - name: Check generated templates are committed
        run: git diff --exit-code -- internal
      - name: Check production publishing and manifests
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.2
          python3 scripts/test-publish-manifest.py
          kustomize build config/overlays/prod > /dev/null
          kustomize build config/overlays/dev > /dev/null
          kustomize build config/overlays/auth-prod > /dev/null
          kustomize build config/flux > /dev/null

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: production-image
      cancel-in-progress: false
      queue: max
    env:
      KO_DOCKER_REPO: ${{ secrets.OCI_REGISTRY_URL }}/herbsfest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check registry credentials
        env:
          OCI_REGISTRY_URL: ${{ secrets.OCI_REGISTRY_URL }}
          OCI_REGISTRY_USER: ${{ secrets.OCI_REGISTRY_USER }}
          OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
        run: |
          test -n "$OCI_REGISTRY_URL" && test -n "$OCI_REGISTRY_USER" && test -n "$OCI_REGISTRY_PASSWORD" || {
            echo '::error::Configure OCI_REGISTRY_URL, OCI_REGISTRY_USER, and OCI_REGISTRY_PASSWORD as repository Actions secrets.'
            exit 1
          }
      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          version: v0.19.1
      - name: Set up Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.2
      - name: Generate templates
        run: make generate
      - name: Log in to OCI registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY_URL }}
          username: ${{ secrets.OCI_REGISTRY_USER }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}
      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          mkdir -p dist
          ko build --bare --platform=linux/amd64 --tags="$GITHUB_SHA" \
            --image-refs=dist/image-refs.txt ./cmd/web
          published=$(cat dist/image-refs.txt)
          [[ "$published" == "$KO_DOCKER_REPO:$GITHUB_SHA"@sha256:* ]]
          digest=${published##*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "$KO_DOCKER_REPO" "$digest" >> "$GITHUB_OUTPUT"
      - name: Commit production image digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: bash scripts/publish-manifest.sh "$GITHUB_SHA" "$IMAGE_REF"
