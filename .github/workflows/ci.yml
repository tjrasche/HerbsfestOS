name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test
      - name: Check generated templates are committed
        run: git diff --exit-code -- internal

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check dispatch credentials
        env:
          GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          test -n "$GITOPS_APP_ID" && test -n "$GITOPS_APP_PRIVATE_KEY" || {
            echo '::error::Configure GITOPS_APP_ID and GITOPS_APP_PRIVATE_KEY. The App must be installed on rasche-thalhofer/k8s-infra with Actions: read and write.'
            exit 1
          }
      - name: Create token for the GitOps builder
        id: gitops
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: rasche-thalhofer
          repositories: k8s-infra
          permission-actions: write
      - name: Publish image and update GitOps
        env:
          GH_TOKEN: ${{ steps.gitops.outputs.token }}
        run: bash scripts/dispatch-build.sh "$GITHUB_SHA"
