apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
spec:
  interval: 30m
  timeout: 15m
  releaseName: zitadel
  chart:
    spec:
      chart: zitadel
      version: 10.3.0
      sourceRef:
        kind: HelmRepository
        name: zitadel
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: zitadel
    replicaCount: 1
    image:
      tag: v4.19.2
    postgresql:
      enabled: false
    # No IAM owner machine keys/PATs are created by this release.
    cleanupJob:
      enabled: false
    zitadel:
      masterkeySecretName: zitadel-bootstrap
      configmapConfig:
        ExternalDomain: auth.herbstfest.r-und-t.app
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          Enabled: false
        DefaultInstance:
          DomainPolicy:
            UserLoginMustBeDomain: false
          LoginPolicy:
            AllowRegister: false
          Features:
            LoginV2:
              Required: true
              BaseURI: https://auth.herbstfest.r-und-t.app/ui/v2/login
        Database:
          Postgres:
            Host: zitadel-postgres-rw.rundt.svc.cluster.local
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 5
            MaxConnLifetime: 30m
            MaxConnIdleTime: 5m
            User:
              Username: zitadel
              SSL:
                Mode: verify-full
        FirstInstance:
          Org:
            Name: Herbstfest
            # The dedicated login system user is managed by chart v10.
            # Avoid also generating the chart's default IAM owner machine/PAT.
            Machine: null
            Human:
              UserName: t@rasche-thalhofer.cloud
              FirstName: Herbstfest
              LastName: Administrator
              Email:
                Address: t@rasche-thalhofer.cloud
                Verified: true
              PasswordChangeRequired: true
    # These env entries are shared by init, setup and the API Deployment.
    env:
    - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: zitadel-postgres-app
          key: password
    - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_ROOTCERT
      value: /postgres-ca/ca.crt
    - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: zitadel-bootstrap
          key: admin-password
    # Project only the public CA; the CNPG Secret also contains a private key.
    extraVolumes:
    - name: postgres-ca
      secret:
        secretName: zitadel-postgres-ca
        items:
        - key: ca.crt
          path: ca.crt
    extraVolumeMounts:
    - name: postgres-ca
      mountPath: /postgres-ca
      readOnly: true
    initJob:
      # CNPG provisions the database/user. This is the chart-supported alias
      # of `zitadel init schema`, using only database owner credentials.
      command: zitadel
      activeDeadlineSeconds: 900
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
    setupJob:
      activeDeadlineSeconds: 900
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    service:
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: h2c
    ingress:
      enabled: false
    login:
      enabled: true
      replicaCount: 1
      image:
        tag: v4.19.2
      sessionCookieSecretName: zitadel-bootstrap
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      readinessProbe:
        timeoutSeconds: 5
      livenessProbe:
        timeoutSeconds: 5
      startupProbe:
        enabled: true
        timeoutSeconds: 5
        failureThreshold: 60
