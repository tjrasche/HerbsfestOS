# Register this separately from the working application Kustomization.
# The existing `herbsfest` GitRepository is owned by the infrastructure repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rundt-zitadel
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 20m
  path: ./config/overlays/auth-prod
  prune: true
  dependsOn:
  - name: rundt-namespace
  - name: longhorn-config
  - name: ingress
  - name: cloudnative-pg-operator
  - name: sealed-secrets
  - name: cert-manager-config
  sourceRef:
    kind: GitRepository
    name: herbsfest
  healthChecks:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: zitadel-postgres
    namespace: rundt
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: zitadel
    namespace: rundt
