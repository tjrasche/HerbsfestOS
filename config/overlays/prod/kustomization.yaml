apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rundt
resources:
- ../../app
- ../../cnpg
- ingress.yaml
- middleware.yaml
- sealedsecret-basic-auth.yaml
- sealedsecret-auth-session.yaml
patches:
- path: database-secret.yaml
- path: postgres.yaml
- path: auth.yaml
- path: openfga.yaml
images:
- digest: sha256:80283bfdf78875162037c01edce769e94fe6567c7b18186bc601052eed074009
  name: ko://github.com/tjrasche/HerbsfestOS/cmd/web
  newName: artifacts.r-und-t.app/herbsfest
configMapGenerator:
- behavior: merge
  literals:
  - AUTH_MODE=oidc
  - OPENFGA_API_URL=http://openfga:8080
  - OPENFGA_TIMEOUT=2s
  - ZITADEL_ISSUER=https://auth.r-und-t.app
  - APP_BASE_URL=https://herbstfest.r-und-t.app
  - ZITADEL_CLIENT_ID=394051797699788961
  - ZITADEL_PROJECT_ID=394051632024780961
  name: herbsfest-config
