apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rundt
resources:
- ../../app
- ../../cnpg
- ingress.yaml
- middleware.yaml
- sealedsecret-basic-auth.yaml
- sealedsecret-auth-session.yaml
patches:
- path: database-secret.yaml
- path: postgres.yaml
- path: auth.yaml
- path: openfga.yaml
images:
- digest: sha256:585d875edd2843e2d086a1ec5b9ba3db90dc91975aebcc1f188c86e1b18510f1
  name: ko://github.com/tjrasche/HerbsfestOS/cmd/web
  newName: artifacts.r-und-t.app/herbsfest
configMapGenerator:
- envs:
  - scheduling-setup.env
  name: herbsfest-scheduling-setup
- behavior: merge
  literals:
  - AUTH_MODE=oidc
  - OPENFGA_API_URL=http://openfga:8080
  - OPENFGA_TIMEOUT=2s
  - ZITADEL_ISSUER=https://auth.r-und-t.app
  - APP_BASE_URL=https://herbstfest.r-und-t.app
  - ZITADEL_CLIENT_ID=394051797699788961
  - ZITADEL_PROJECT_ID=394051632024780961
  name: herbsfest-config
