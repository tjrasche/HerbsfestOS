apiVersion: apps/v1
kind: Deployment
metadata:
  name: herbsfest
spec:
  template:
    spec:
      initContainers:
      - name: prepare
        env:
        - name: OPENFGA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: openfga-api-auth
              key: API_TOKEN
      containers:
      - name: web
        env:
        - name: OPENFGA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: openfga-api-auth
              key: API_TOKEN
