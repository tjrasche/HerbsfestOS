apiVersion: apps/v1
kind: Deployment
metadata:
  name: herbsfest
spec:
  template:
    spec:
      imagePullSecrets:
        - name: oci-registry-cred
      containers:
        - name: web
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: herbsfest-postgres-app
                  key: uri
