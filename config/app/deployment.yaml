apiVersion: apps/v1
kind: Deployment
metadata:
  name: herbsfest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: herbsfest
  template:
    metadata:
      labels:
        app: herbsfest
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ko://github.com/tjrasche/HerbsfestOS/cmd/web
          args: ["-migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: herbsfest-database
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: web
          image: ko://github.com/tjrasche/HerbsfestOS/cmd/web
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: herbsfest-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: herbsfest-database
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
